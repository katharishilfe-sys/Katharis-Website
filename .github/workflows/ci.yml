name: CI

on:
  push:
    branches: [main, astro-v2-greenfield]
  pull_request:
    branches: [main, astro-v2-greenfield]

jobs:
  build:
    name: Build + Drift-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Astro check (TypeScript + Astro errors)
        run: npx astro check
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Drift-Check (Master Anhang B.2)
        run: bash scripts/drift-check.sh
